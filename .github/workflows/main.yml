name: Hot Wheels Drop Tracker

on:
  schedule:
    - cron: "30 1-17 * * *"   # hourly, 07:00-23:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Hot Wheels Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELIVERY_LATITUDE: ${{ secrets.DELIVERY_LATITUDE || '0' }}
          DELIVERY_LONGITUDE: ${{ secrets.DELIVERY_LONGITUDE || '0' }}
        run: python hotwheels_bot.py

      - name: Save seen-products state
        run: |
          if [ -f listing_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f listing_state.json
            git diff --cached --quiet || (git commit -m "chore: update seen products state [skip ci]" && git push)
          fi
